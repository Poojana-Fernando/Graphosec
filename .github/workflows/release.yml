name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained build
        shell: pwsh
        run: ./installer/publish-release.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}","${env:ProgramFiles}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install." }
          echo "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Compile installer
        shell: pwsh
        run: & $env:ISCC installer/ResumableCopy.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/installer/Graphosec-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
